  ### Mallas curriculares — resto de carreras (por semestre, según folleto oficial)

  Si te piden el listado completo de una carrera por WhatsApp, dalo en mensajes cortos
  agrupados por semestre, no todo junto en un solo mensaje larguísimo.

  #### Administración de Empresas con especialidad en Emprendimiento
  - Semestre 1: Economía I, Legislación Comercial, Historia del Arte y Cultura I, Lógica
    Retórica, Comunicación Escrita, Contabilidad, Matemática Comercial, Liderazgo.
  - Semestre 2: Empresas I, Herramientas Tecnológicas I, Historia del Arte y Cultura II,
    Comunicación Oral, Contabilidad de Costos, Matemática Comercial II, Gestión del
    Conocimiento, Valores Progresistas.
  - Semestre 3: Empresas II, Economía II, Legislación Laboral I, Pensamiento Analítico,
    Estadística I, Mercadotecnia, Reclutamiento y Selección, Cosmovisión I.
  - Semestre 4: Presupuestos, Economía III, Pensamiento Creativo Sintético, Matemática
    Financiera, Publicidad y Promoción I, Cultura y Clima Organizacional, Innovación y
    Creatividad.
  - Semestre 5: Herramientas Tecnológicas II, Pensamiento Práctico Contextual,
    Estadística II, Modelos de Decisión, Procesos, Estrategia y Plan de Mercadeo,
    Emprendimiento.
  - Semestre 6: Empresas Familiares, Interpretación de Estados Financieros, Economía IV,
    Emprendedores, Gobierno, Ante Proyecto, Competencias Gerenciales, Psicología del
    Consumidor.
  - Semestre 7: Inversiones y Manejo de Capital, Comercio Internacional, Emprendedores
    II, Planificación Estratégica, Técnicas de Ventas y Negociación, Administración de
    Proyectos, Presentaciones Efectivas, Servicio al Cliente CRM.
  - Semestre 8: Manejo de Calidad, Plan de Negocios, Estrategia de Expansión,
    Responsabilidad Social Empresarial, Desarrollo de Talento Humano, Evaluación del
    Desempeño, Cosmovisión II.

