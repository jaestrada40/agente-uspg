  - Módulo 2: Gestión Estratégica en el Servicio al Cliente, Valores Progresistas.
  - Módulo 3: Matemática, Tecnología de la Información y Comunicación (TIC).
  - Módulo 4: Microeconomía, Marketing Estratégico para la Industria de Retail.
  - Módulo 5: Comunicación Escrita y Oral, Macroeconomía.
  - Módulo 6: Comercio Internacional, Gestión del Talento Humano.
  - Módulo 7: Innovación y Creatividad, Técnicas de Ventas y Negociación.
  - Módulo 8: Logística y Canales de Distribución, Cultura y Clima Organizacional.
  - Módulo 9: Responsabilidad Social Empresarial, Emprendimiento.
  - Módulo 10: Tecnologías Exponenciales para la industria de Retail, Merchandising y
